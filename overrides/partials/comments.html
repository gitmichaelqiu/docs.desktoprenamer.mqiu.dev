{% if page.meta.comments %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
  <div class="giscus-wrapper">

  <script src="https://giscus.app/client.js"
        data-repo="gitmichaelqiu/blog"
        data-repo-id="R_kgDOQ2I6dw"
        data-category="Announcements"
        data-category-id="DIC_kwDOQ2I6d84C5xKT"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="1"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="en"
        crossorigin="anonymous"
        async>
  </script>

  <!-- Synchronize Giscus theme with palette -->
  <script>
    var giscus = document.querySelector("script[src*=giscus]")

    var palette = __md_get("__palette")
    if (palette && typeof palette.color === "object") {
      var theme = palette.color.scheme === "slate"
        ? "transparent_dark"
        : "light"
      giscus.setAttribute("data-theme", theme)
    }

    document.addEventListener("DOMContentLoaded", function() {
      var ref = document.querySelector("[data-md-component=palette]")
      ref.addEventListener("change", function() {
        var palette = __md_get("__palette")
        if (palette && typeof palette.color === "object") {
          var theme = palette.color.scheme === "slate"
            ? "transparent_dark"
            : "light"
          var frame = document.querySelector(".giscus-frame")
          frame.contentWindow.postMessage(
            { giscus: { setConfig: { theme } } },
            "https://giscus.app"
          )
        }
      })

      // Giscus loads a cross-origin iframe that captures wheel events.
      // Intercept them during the capture phase (before they reach the
      // iframe) and redirect to the parent page scroll.
      document.addEventListener('wheel', function(e) {
        var frame = document.querySelector('.giscus-frame')
        if (frame && (e.target === frame || frame.contains(e.target))) {
          e.preventDefault()
          window.scrollBy({ top: e.deltaY, behavior: 'auto' })
        }
      }, { passive: false, capture: true })
    })
  </script>
  </div>
{% endif %}
